apiVersion: apps/v1
kind: Deployment
metadata:
  name: mergen-frontend
  labels:
    app: mergen-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mergen-frontend
  template:
    metadata:
      labels:
        app: mergen-frontend
    spec:
      containers:
      - name: frontend
        image: mergen-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: mergen-frontend-service
spec:
  type: NodePort
  selector:
    app: mergen-frontend
  ports:
  - port: 5173
    targetPort: 5173
    nodePort: 30173
